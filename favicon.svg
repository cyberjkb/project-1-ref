<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Metallic Silver for Borders -->
    <linearGradient id="silverMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#9aa0a6" />
      <stop offset="50%" stop-color="#e8eaed" />
      <stop offset="100%" stop-color="#5f6368" />
    </linearGradient>
    
    <!-- Metallic Ruby Red for the Roundel -->
    <linearGradient id="redMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4d" />
      <stop offset="50%" stop-color="#cc0000" />
      <stop offset="100%" stop-color="#660000" />
    </linearGradient>
    
    <!-- Metallic Blue for the Horizontal Bar -->
    <linearGradient id="blueMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4d88ff" />
      <stop offset="40%" stop-color="#0033cc" />
      <stop offset="100%" stop-color="#00114d" />
    </linearGradient>
    
    <!-- Dark Metallic Blue for the Shield Background -->
    <linearGradient id="shieldBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a4d7a" />
      <stop offset="50%" stop-color="#0f203b" />
      <stop offset="100%" stop-color="#050a14" />
    </linearGradient>
    
    <!-- Subtle Drop Shadow for the Text -->
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.5" flood-color="#000000" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- Winged Outer Shield (Matches your generated image's silhouette) -->
  <!-- Uses a curve (Q) for the top and lines (L) for the pointed bottom -->
  <path d="M 5,30 Q 50,0 95,30 L 90,45 L 50,95 L 10,45 Z" fill="url(#shieldBlue)" stroke="url(#silverMetal)" stroke-width="3" />
  
  <!-- Outer Silver Rim of the Roundel -->
  <circle cx="50" cy="48" r="30" fill="none" stroke="url(#silverMetal)" stroke-width="2" />
  
  <!-- Thick Metallic Red Roundel Circle -->
  <circle cx="50" cy="48" r="26" fill="none" stroke="url(#redMetal)" stroke-width="6" />
  
  <!-- Inner Silver Rim of the Roundel -->
  <circle cx="50" cy="48" r="22" fill="none" stroke="url(#silverMetal)" stroke-width="1.5" />

  <!-- Silver Background for the Text Bar -->
  <rect x="8" y="39" width="84" height="18" fill="url(#silverMetal)" rx="1" ry="1" />
  
  <!-- Metallic Blue Overlay for the Text Bar -->
  <rect x="10" y="41" width="80" height="14" fill="url(#blueMetal)" />

  <!-- Bold MTGM Text -->
  <text x="50" y="52" font-family="&#39;Arial Black&#39;, Impact, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle" filter="url(#textShadow)" letter-spacing="1">MTGM</text>
</svg>